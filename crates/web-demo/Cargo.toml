[package]
name = "terra-web"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The reference matcher and settlement drafts as a WebAssembly module for the browser demo."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
matcher-api = { path = "../matcher-api" }
matcher-stub = { path = "../matcher-stub" }
settlement = { path = "../settlement" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
