[package]
name = "terra-keys"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "terra-keys"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde_json = "1"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
hex = "0.4"
serde_json = "1"
