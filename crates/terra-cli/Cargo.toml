[package]
name = "terra-cli"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[[bin]]
name = "terra"
path = "src/main.rs"

[features]
default = []
http = ["settlement/http", "dep:intents-sign"]

[dependencies]
matcher-api = { path = "../matcher-api" }
matcher-stub = { path = "../matcher-stub" }
settlement = { path = "../settlement" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
intents-sign = { path = "../intents-sign", optional = true }
