[package]
name = "terra-1b"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Real mainnet run of one Terra fill on NEAR Intents: throwaway keys, balances, simulation, and one execute_intents transaction sent only after a typed confirmation"

[[bin]]
name = "terra-1b"
path = "src/main.rs"

[dependencies]
matcher-api = { path = "../matcher-api" }
matcher-stub = { path = "../matcher-stub" }
settlement = { path = "../settlement", features = ["http"] }
intents-sign = { path = "../intents-sign" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
