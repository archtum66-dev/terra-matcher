[package]
name = "intents-sign"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "NEP-413 signing of Terra settlement drafts for the NEAR Intents verifier, and its protocol fee"

[dependencies]
settlement = { path = "../settlement" }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10.8"
serde_json = "1.0.138"

[dev-dependencies]
hex = "0.4"
