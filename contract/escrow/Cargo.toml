[package]
name = "escrow"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
near-sdk = "5"
escrow-types = { path = "../../crates/escrow-types" }
hex = "0.4.3"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
ed25519-dalek = "2.1.1"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
codegen-units = 1
